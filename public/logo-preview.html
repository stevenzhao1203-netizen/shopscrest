<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShopsCrest Logo Preview</title>
    <link rel="icon" href="/favicon.ico?v=8" sizes="32x32" />
    <link rel="icon" href="/favicon.svg?v=8" type="image/svg+xml" />
    <style>
      :root {
        color: #111713;
        background: #fbfaf7;
        font-family: Inter, Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        padding: 40px;
      }

      main {
        display: grid;
        gap: 28px;
        max-width: 920px;
      }

      section {
        border: 1px solid #e2ded6;
        background: #fff;
        padding: 28px;
      }

      h1,
      h2 {
        margin: 0;
        line-height: 1.2;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        color: #68716c;
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .logo-row {
        display: flex;
        align-items: center;
        gap: 32px;
        margin-top: 22px;
      }

      .site-logo {
        width: 302px;
        height: auto;
      }

      .favicon-set {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .favicon-large {
        width: 128px;
        height: 128px;
      }

      .favicon-small {
        width: 32px;
        height: 32px;
        image-rendering: auto;
      }

      .favicon-tiny {
        width: 16px;
        height: 16px;
        image-rendering: auto;
      }

      .label {
        color: #68716c;
        font-size: 13px;
        font-weight: 700;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>ShopsCrest Logo Preview</h1>
      </section>

      <section>
        <h2>Website Header Logo</h2>
        <div class="logo-row">
          <img class="site-logo" src="assets/shopscrest-logo-v2.svg" alt="ShopsCrest website logo" />
        </div>
      </section>

      <section>
        <h2>Browser Tab Favicon</h2>
        <div class="favicon-set">
          <div>
            <img class="favicon-large" src="favicon.svg?v=8" alt="ShopsCrest favicon large preview" />
            <div class="label">128px preview</div>
          </div>
          <div>
            <img class="favicon-small" src="favicon.svg?v=8" alt="ShopsCrest favicon 32px preview" />
            <div class="label">32px</div>
          </div>
          <div>
            <img class="favicon-tiny" src="favicon.svg?v=8" alt="ShopsCrest favicon 16px preview" />
            <div class="label">16px tab size</div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
